<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Zeno Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { position: relative; z-index: 1; width: 100%; max-width: 420px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--muted); text-decoration: none; font-size: 0.72rem;
            font-weight: 600; letter-spacing: 2px; margin-bottom: 28px;
            transition: color 0.2s; text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }
        .back-link:hover { color: var(--green); }
        .card-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem; font-weight: 700; color: var(--green);
            letter-spacing: 4px; margin-bottom: 6px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,255,135,0.4);
        }
        .card-logo span { color: var(--muted); }
        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem; font-weight: 700; margin-bottom: 4px;
            letter-spacing: 4px; text-transform: uppercase;
        }
        .card-sub { color: var(--muted); font-size: 0.75rem; margin-bottom: 32px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 24px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        .bottom-link { text-align: center; font-size: 0.8rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
        .bottom-link a { color: var(--green); text-decoration: none; font-weight: 700; }
        .bottom-link a:hover { text-shadow: 0 0 10px rgba(0,255,135,0.4); }
    </style>
</head>
<body>
    <div class="glow-green"></div>
    <div class="container">
        <a href="/" class="back-link">← Kembali</a>
        <div class="card">
            <div class="card-logo">ZENO<span>STORE</span></div>
            <h1 class="card-title">LOGIN</h1>
            <p class="card-sub">// Masuk ke akun kamu</p>

            <div class="alert alert-error" id="alertError"></div>
            <div class="alert alert-success" id="alertSuccess"></div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@kamu.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn btn-primary btn-full" id="btnLogin" onclick="handleLogin()">MASUK →</button>

            <div class="divider"><span>atau</span></div>
            <div class="bottom-link">Belum punya akun? <a href="/register">Daftar Sekarang</a></div>
        </div>
    </div>
    <script>
        document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            hide('alertError'); hide('alertSuccess');
            if (!email || !password) return showAlert('alertError', '[ ERROR ] Email dan password harus diisi!');
            btn.disabled = true; btn.textContent = 'MEMPROSES...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('zenoUser', JSON.stringify({ username: data.username, userId: data.userId, email: data.email }));
                    showAlert('alertSuccess', `[ OK ] Selamat datang, ${data.username}!`);
                    setTimeout(() => window.location.href = '/dashboard', 1200);
                } else {
                    showAlert('alertError', `[ ERROR ] ${data.message}`);
                    btn.disabled = false; btn.textContent = 'MASUK →';
                }
            } catch {
                showAlert('alertError', '[ ERROR ] Terjadi kesalahan. Coba lagi.');
                btn.disabled = false; btn.textContent = 'MASUK →';
            }
        }
        function showAlert(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
        function hide(id) { document.getElementById(id).style.display = 'none'; }
    </script>
    <script src="/navbar.js"></script>
    <script>initNavbar("login");</script>
</body>
</html>
